<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>وكيل واحد</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:30px auto;padding:0 16px;background:#f5f6f8;color:#111}
.card{background:#fff;padding:20px;border-radius:14px;box-shadow:0 2px 10px #0001}
h1{margin-top:0}
textarea{width:100%;box-sizing:border-box;min-height:130px;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:10px;resize:vertical}
button{margin-top:10px;padding:12px 22px;border:0;border-radius:10px;background:#1769e0;color:#fff;font-size:16px;cursor:pointer}
button:disabled{opacity:.6}
.status{margin:15px 0;font-weight:bold}
.result{white-space:pre-wrap;line-height:1.8;background:#fafafa;padding:15px;border-radius:10px}
.sources{line-height:1.8}
.meta{font-size:13px;color:#666;margin-top:12px}
a{word-break:break-all}
</style>
</head>
<body>

<div class="card">
<h1>وكيل واحد</h1>
<p>اكتب المهمة وسيبحث الوكيل في الويب ثم يجيبك.</p>

<textarea id="task" placeholder="اكتب المهمة هنا..."></textarea>
<br>

<button id="run">نفّذ المهمة</button>

<div id="status" class="status"></div>
<div id="result"></div>
<div id="sources"></div>
<div id="meta" class="meta"></div>
</div>

<script>
const task = document.getElementById("task");
const run = document.getElementById("run");
const status = document.getElementById("status");
const result = document.getElementById("result");
const sources = document.getElementById("sources");
const meta = document.getElementById("meta");

run.onclick = async () => {
  const value = task.value.trim();

  if (!value) {
    status.textContent = "اكتب المهمة أولًا.";
    return;
  }

  run.disabled = true;
  status.textContent = "جاري التنفيذ...";
  result.innerHTML = "";
  sources.innerHTML = "";
  meta.textContent = "";

  try {
    const response = await fetch("/api/run", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ task: value })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "حدث خطأ.");
    }

    result.innerHTML =
      "<h2>النتيجة</h2>" +
      "<div class='result'>" +
      escapeHtml(data.result) +
      "</div>";

    if (data.sources && data.sources.length) {
      sources.innerHTML =
        "<h2>المصادر</h2>" +
        "<ol class='sources'>" +
        data.sources.map(source =>
          "<li>" +
          escapeHtml(source.title) +
          "<br>" +
          "<a href='" +
          encodeURI(source.url) +
          "' target='_blank' rel='noopener'>" +
          escapeHtml(source.url) +
          "</a>" +
          "</li>"
        ).join("") +
        "</ol>";
    }

    meta.textContent =
      "النموذج: " + data.model +
      " | الإدخال: " + data.usage.input_tokens +
      " | الإخراج: " + data.usage.output_tokens +
      " | الإجمالي: " + data.usage.total_tokens +
      " | الزمن: " + data.elapsed_ms + "ms";

    status.textContent = "اكتمل.";

  } catch (error) {
    status.textContent = "خطأ: " + error.message;
  } finally {
    run.disabled = false;
  }
};

function escapeHtml(value) {
  return String(value).replace(
    /[&<>"']/g,
    character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[character])
  );
}
</script>

</body>
</html>
